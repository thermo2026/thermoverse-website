<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThermoVerse CRM</title><style>body{margin:0;background:#f7f8f9;color:#172936;font:16px/1.5 Arial,sans-serif}header{padding:22px 5%;background:#172936;color:white;display:flex;justify-content:space-between;align-items:center}main{padding:32px 5%;max-width:1300px;margin:auto}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #ccd5db;border-radius:8px}button{background:#df4862;color:#fff;border:0;cursor:pointer}button.secondary{background:#315064}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar input{min-width:260px}.hidden{display:none}#error{color:#b92f47}table{width:100%;margin-top:24px;border-collapse:collapse;background:white}th,td{padding:12px;border-bottom:1px solid #e0e6ea;text-align:left;vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#536673}tr{cursor:pointer}tr:hover{background:#f7fbfc}.detail{margin-top:28px;padding:24px;background:#fff;border-radius:12px}.detail dl{display:grid;grid-template-columns:180px 1fr;gap:10px}.detail dt{font-weight:bold}.detail dd{margin:0;white-space:pre-wrap}@media(max-width:760px){table{font-size:13px}.hide-sm{display:none}.detail dl{grid-template-columns:1fr}}</style></head><body><header><strong>ThermoVerse CRM</strong><span id="session">Local administration</span></header><main><section id="login"><h1>Administrator sign-in</h1><p>Enter the local CRM token. For AWS, replace this with Cognito.</p><form id="login-form" class="toolbar"><input id="token" type="password" autocomplete="current-password" placeholder="CRM_ADMIN_TOKEN" required><button>Open CRM</button></form><p id="error" role="alert"></p></section><section id="crm" class="hidden"><div class="toolbar"><h1 style="margin-right:auto">Inquiries</h1><button id="refresh" class="secondary">Refresh</button><button id="export">Export CSV</button><button id="signout" class="secondary">Sign out</button></div><p id="count"></p><table><thead><tr><th>Received</th><th>Name</th><th class="hide-sm">Organization</th><th>Type</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><section id="detail" class="detail hidden"></section></section></main><script>let token='',items=[];const $=s=>document.querySelector(s);const api=(path,opt={})=>fetch(path,{...opt,headers:{...opt.headers,Authorization:'Bearer '+token,'Content-Type':'application/json'}});function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const r=await api('/api/inquiries');if(!r.ok)throw new Error((await r.json()).error);items=(await r.json()).items;$('#count').textContent=items.length+' inquiry'+(items.length===1?'':'ies');$('#rows').innerHTML=items.map(i=>`<tr data-id="${i.id}"><td>${new Date(i.created_at).toLocaleString()}</td><td>${esc(i.name)}<br><small>${esc(i.email)}</small></td><td class="hide-sm">${esc(i.organization||'—')}</td><td>${esc(i.inquiry_type)}</td><td>${esc(i.status)}</td></tr>`).join('');document.querySelectorAll('#rows tr').forEach(r=>r.onclick=()=>show(r.dataset.id))}function show(id){const i=items.find(x=>x.id===id),fields=[['Email',i.email],['Organization',i.organization],['Role',i.role],['Source',i.source],['Language',i.language],['Message',i.message],['Site type',i.site_type],['Location',i.location],['Building description',i.site_description],['Current challenge',i.current_problem],['Available data',i.data_available],['Preferred contact time',i.contact_time]];$('#detail').classList.remove('hidden');$('#detail').innerHTML=`<h2>${esc(i.name)}</h2><div class="toolbar"><label>Status <select id="status">${['new','in_review','contacted','closed'].map(x=>`<option ${x===i.status?'selected':''}>${x}</option>`).join('')}</select></label><button id="save">Save update</button></div><p><label>Internal note<br><textarea id="note" rows="4" style="width:min(700px,100%)">${esc(i.internal_note)}</textarea></label></p><dl>${fields.filter(x=>x[1]).map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl>`;$('#save').onclick=async()=>{const r=await api('/api/inquiries/'+i.id,{method:'PATCH',body:JSON.stringify({status:$('#status').value,internalNote:$('#note').value})});if(!r.ok)return alert((await r.json()).error);await load();show(i.id)}}$('#login-form').onsubmit=async e=>{e.preventDefault();token=$('#token').value;try{await load();$('#login').classList.add('hidden');$('#crm').classList.remove('hidden')}catch(err){$('#error').textContent=err.message}};$('#refresh').onclick=load;$('#signout').onclick=()=>location.reload();$('#export').onclick=async()=>{const r=await api('/api/inquiries.csv');if(!r.ok)return alert('Export failed');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='thermoverse-inquiries.csv';a.click()}</script></body></html>
