<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThermoVerse CRM</title><link rel="stylesheet" href="./styles.css"></head><body>
<section id="login" class="login-screen"><form id="login-form" class="login-card"><div class="brand-mark">TV</div><p class="eyebrow">THERMOVERSE</p><h1>Customer relations</h1><p class="muted">Sign in to manage inquiries, relationships, deals and follow-up work.</p><div id="login-fields"><label>Email<input id="username" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><label id="new-password-wrap" class="hidden">New password<input id="new-password" type="password" autocomplete="new-password" minlength="14"></label></div><button class="primary full">Sign in</button><p id="login-error" class="error" role="alert"></p><small id="login-help">Loading sign-in configuration…</small></form></section>
<div id="app" class="app hidden"><aside class="sidebar"><div class="logo"><b>ThermoVerse</b><span>CUSTOMER RELATIONS</span></div><nav id="nav"></nav><div class="user"><span class="avatar">A</span><div><b id="user-name">CRM user</b><small id="user-role">Administrator</small></div><button id="signout" class="icon" title="Sign out">↗</button></div></aside><main class="main"><header class="topbar"><button id="menu" class="icon mobile">☰</button><div><p id="crumb" class="eyebrow">WORKSPACE</p><h1 id="title">Dashboard</h1></div><div class="top-actions"><button id="refresh" class="secondary">↻ Refresh</button><button id="quick-add" class="primary">＋ New</button></div></header><div id="view" class="view"></div></main></div>
<div id="drawer-backdrop" class="backdrop hidden"><aside id="drawer" class="drawer"></aside></div><div id="toast" class="toast hidden" role="status"></div><script src="./config.js"></script><script src="./app.js"></script></body></html>
