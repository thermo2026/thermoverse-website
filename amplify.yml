version: 1
frontend:
  phases:
    build:
      commands:
        - mkdir -p CRM && cp -r crm-ui/* CRM/
        - mkdir -p crm && cp -r crm-ui/* crm/
  artifacts:
    baseDirectory: .
    files:
      - 'index.html'
      - 'about.html'
      - 'technology.html'
      - 'use-cases.html'
      - 'contact.html'
      - 'privacy.html'
      - 'styles.css'
      - 'script.js'
      - 'assets/**/*'
      - 'zh/**/*'
      - 'CRM/**/*'
      - 'crm/**/*'
  cache:
    paths: []
